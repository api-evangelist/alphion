name: Alphion
description: >-
  Alphion Corporation is a broadband access equipment manufacturer that develops
  fiber-optic and wireless networking solutions for network operators, enterprises,
  and community networks. Founded in 2000 and based in Princeton Junction, New Jersey,
  the company builds GPON-based fiber-to-the-x (FTTx/FTTH) access systems, optical
  network terminals (AONT/ONT), and secure GigaWi-Fi broadband access products that
  deliver voice, data, video, and wireless services over passive optical networks.
  Alphion is a photonics and telecommunications hardware provider; it was surfaced as
  a portfolio company of Battery Ventures and added to the API Evangelist network as a
  company profile. It does not currently publish a developer portal, public API, or
  machine-readable API specification.
